
name: SDC Backend CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sdc-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Django to DigitalOcean
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure SSH
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -eu

          test -n "$DO_HOST"
          test -n "$DO_USER"
          test -n "$DO_SSH_KEY"
          test -n "$DO_KNOWN_HOSTS"

          install -d -m 700 ~/.ssh
          printf '%s\n' "$DO_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$DO_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to DigitalOcean
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DO_USER@$DO_HOST" \
            'sudo bash /usr/local/sbin/deploy-sdc-backend'

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
